    name: la-olla-magica 10-11
    runs_on: linux-medium
    steps:
      - uses: eas/checkout
      - run: bash tools/dibujar-gratis.sh 'la-olla-magica:10,la-olla-magica:11'
      - uses: eas/upload_artifact
        if: ${{ always() }}
        with:
          type: other
          name: dibujos-00
          ignore_error: true
